version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` in the `root` directory
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
    # Assign PRs to the @dependabot user for visibility
    assignees:
      - "@dependabot"
    # Apply security updates immediately
    commit-message:
      prefix: "security"
      prefix-development: "[DEV] "
      include: "scope"
    # Group updates by dependency type
    groups:
      production:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
    # Ignore major version updates by default
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "@dependabot"
