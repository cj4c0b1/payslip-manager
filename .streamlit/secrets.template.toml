# Application secret key (generate a new one for production)
SECRET_KEY = "your-secret-key-here"

# Database configuration
[database]
# For SQLite (development only)
url = "sqlite:///data/payslips.db"
# For production, use a proper database like PostgreSQL:
# url = "postgresql://user:password@host:port/dbname"

# Authentication
[authentication]
# Username and hashed password (generate with: python -c "from passlib.hash import bcrypt; print(bcrypt.hash('yourpassword'))")
username = "admin"
password = "$2b$12$your_hashed_password_here"

# Encryption key (generate with: python -c "import os; print(os.urandom(32).hex())")
ENCRYPTION_KEY = "your-encryption-key-here"

# Session configuration
[session]
cookie_name = "_secure_payslip_session"

# Email configuration (optional)
[email]
smtp_server = "smtp.example.com"
smtp_port = 587
smtp_username = "your-email@example.com"
smtp_password = "your-email-password"
from_email = "your-email@example.com"
default_sender = "Payslip Manager <your-email@example.com>"
default_sender_name = "Payslip Manager"
templates_dir = "email_templates"
test_recipient = "test@example.com"

# GitHub integration (optional)
GITHUB_TOKEN = "your-github-token-here"
